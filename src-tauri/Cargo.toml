[package]
name = "facet"
version = "0.1.0"
description = "A local-first Markdown kanban desktop app for macOS"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "facet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"
