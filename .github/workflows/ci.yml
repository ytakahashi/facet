name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: true

      - name: Check
        run: vp run check

      - name: Run Tests
        run: vp run test

      - name: Check vendored YAML version
        run: vp run check:vendor

      - name: Build
        run: vp run build

  desktop-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: true

      # Installs the toolchain rust-toolchain.toml pins, with its components.
      # Rust runs on this job only: the tauri crate needs the macOS WebView.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Lint Rust
        run: vp run lint:rust

      - name: Test Rust
        run: vp run test:rust

      - name: Build desktop app
        run: vp run desktop
