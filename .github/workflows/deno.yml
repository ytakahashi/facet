name: Deno

on:
  push:
    branches: [main]
  pull_request:
    branches:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true

      - name: Setup
        run: deno install --frozen

      - name: Lint
        run: deno task lint

      - name: Check code format
        run: deno fmt --check

      - name: Run Tests
        run: deno task test

      - name: Build
        run: deno task build

  desktop-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true

      - name: Install dependencies
        run: deno install --frozen

      # Installs the toolchain rust-toolchain.toml pins, with its components.
      # Rust runs on this job only: the tauri crate needs the macOS WebView.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Lint Rust
        run: deno task lint:rust

      - name: Test Rust
        run: deno task test:rust

      - name: Build desktop app
        run: deno task desktop
